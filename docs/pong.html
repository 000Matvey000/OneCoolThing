<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Pong</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #04040d;
      --panel: #0d1022;
      --glow: #47f8ff;
      --glow-alt: #ff4fd8;
      --text: #f5f7ff;
      --muted: #9fb3d1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 15%, #0f2b52, transparent 34%),
        radial-gradient(circle at 85% 20%, #4e1455, transparent 38%),
        linear-gradient(170deg, #04040d, #090b1a 55%, #030309);
      font-family: "Courier New", Courier, monospace;
      color: var(--text);
      padding: 1rem;
    }

    main {
      width: min(92vw, 900px);
      display: grid;
      gap: 0.9rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      border: 2px solid var(--glow);
      box-shadow: 0 0 18px color-mix(in srgb, var(--glow) 50%, transparent);
      background: color-mix(in srgb, var(--panel) 92%, black);
      padding: 0.75rem 1rem;
      border-radius: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.88rem;
    }

    .score {
      display: flex;
      gap: 1.2rem;
      font-size: 1rem;
      font-weight: 700;
    }

    .hotkeys {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .canvas-wrap {
      border: 2px solid var(--glow-alt);
      border-radius: 0.75rem;
      padding: 0.45rem;
      background: #000;
      box-shadow: 0 0 22px color-mix(in srgb, var(--glow-alt) 38%, transparent);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      image-rendering: pixelated;
      border-radius: 0.35rem;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .actions a,
    .actions button {
      border: 2px solid var(--glow);
      background: color-mix(in srgb, var(--panel) 94%, black);
      color: var(--text);
      padding: 0.45rem 0.8rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.78rem;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .actions a:hover,
    .actions button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 14px color-mix(in srgb, var(--glow) 45%, transparent);
    }

    .status {
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 640px) {
      .score {
        width: 100%;
        justify-content: space-between;
      }

      .hotkeys {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar" aria-label="Pong score panel">
      <div class="score">
        <span>Player: <strong id="player-score">0</strong></span>
        <span>CPU: <strong id="cpu-score">0</strong></span>
      </div>
      <p class="hotkeys">W/S or ↑/↓ to move · Space to pause</p>
    </section>

    <div class="canvas-wrap">
      <canvas id="pong" width="960" height="540" role="img" aria-label="Arcade Pong game board"></canvas>
    </div>

    <div class="actions">
      <a href="index.html">← Back to contact page</a>
      <button id="reset-btn" type="button">Reset match</button>
      <span class="status" id="status">First to 7 wins.</span>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');

    const playerScoreEl = document.getElementById('player-score');
    const cpuScoreEl = document.getElementById('cpu-score');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');

    const WIN_SCORE = 7;
    const paddle = {
      width: 16,
      height: 108,
      speed: 8
    };

    const state = {
      playerY: canvas.height / 2 - paddle.height / 2,
      cpuY: canvas.height / 2 - paddle.height / 2,
      ballX: canvas.width / 2,
      ballY: canvas.height / 2,
      ballVX: 6,
      ballVY: 3,
      playerScore: 0,
      cpuScore: 0,
      paused: false,
      gameOver: false,
      keys: {
        up: false,
        down: false
      }
    };

    function resetBall(direction = 1) {
      state.ballX = canvas.width / 2;
      state.ballY = canvas.height / 2;
      const speed = 6;
      state.ballVX = speed * direction;
      state.ballVY = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2.2);
    }

    function resetMatch() {
      state.playerScore = 0;
      state.cpuScore = 0;
      state.playerY = canvas.height / 2 - paddle.height / 2;
      state.cpuY = canvas.height / 2 - paddle.height / 2;
      state.gameOver = false;
      state.paused = false;
      resetBall(Math.random() > 0.5 ? 1 : -1);
      updateScore();
      statusEl.textContent = 'First to 7 wins.';
    }

    function updateScore() {
      playerScoreEl.textContent = String(state.playerScore);
      cpuScoreEl.textContent = String(state.cpuScore);
    }

    function drawCenterLine() {
      ctx.fillStyle = '#5deeff';
      const segmentHeight = 20;
      const gap = 14;
      for (let y = 0; y < canvas.height; y += segmentHeight + gap) {
        ctx.fillRect(canvas.width / 2 - 3, y, 6, segmentHeight);
      }
    }

    function drawPaddle(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(state.ballX, state.ballY, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#020202';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenterLine();
      drawPaddle(32, state.playerY, '#47f8ff');
      drawPaddle(canvas.width - 32 - paddle.width, state.cpuY, '#ff4fd8');
      drawBall();

      if (state.paused && !state.gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f6f8ff';
        ctx.font = '44px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }

      if (state.gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f6f8ff';
        ctx.textAlign = 'center';
        ctx.font = '44px "Courier New", monospace';
        ctx.fillText(state.playerScore > state.cpuScore ? 'YOU WIN' : 'CPU WINS', canvas.width / 2, canvas.height / 2 - 12);
        ctx.font = '24px "Courier New", monospace';
        ctx.fillText('Press Reset Match', canvas.width / 2, canvas.height / 2 + 36);
      }
    }

    function clampPaddles() {
      state.playerY = Math.max(0, Math.min(canvas.height - paddle.height, state.playerY));
      state.cpuY = Math.max(0, Math.min(canvas.height - paddle.height, state.cpuY));
    }

    function updatePlayer() {
      if (state.keys.up) state.playerY -= paddle.speed;
      if (state.keys.down) state.playerY += paddle.speed;
      clampPaddles();
    }

    function updateCpu() {
      const paddleCenter = state.cpuY + paddle.height / 2;
      const delta = state.ballY - paddleCenter;
      const cpuSpeed = 5.2;
      if (Math.abs(delta) > 10) {
        state.cpuY += Math.sign(delta) * Math.min(cpuSpeed, Math.abs(delta));
      }
      clampPaddles();
    }

    function bounceFromPaddle(paddleY, isPlayerSide) {
      const center = paddleY + paddle.height / 2;
      const relativeIntersect = (state.ballY - center) / (paddle.height / 2);
      const bounceAngle = relativeIntersect * (Math.PI / 3);
      const speed = Math.min(13, Math.hypot(state.ballVX, state.ballVY) + 0.5);
      const direction = isPlayerSide ? 1 : -1;
      state.ballVX = Math.cos(bounceAngle) * speed * direction;
      state.ballVY = Math.sin(bounceAngle) * speed;
    }

    function handleCollisions() {
      if (state.ballY <= 10 || state.ballY >= canvas.height - 10) {
        state.ballVY *= -1;
        state.ballY = Math.max(10, Math.min(canvas.height - 10, state.ballY));
      }

      if (
        state.ballX - 10 <= 32 + paddle.width &&
        state.ballY >= state.playerY &&
        state.ballY <= state.playerY + paddle.height &&
        state.ballVX < 0
      ) {
        state.ballX = 32 + paddle.width + 10;
        bounceFromPaddle(state.playerY, true);
      }

      const cpuX = canvas.width - 32 - paddle.width;
      if (
        state.ballX + 10 >= cpuX &&
        state.ballY >= state.cpuY &&
        state.ballY <= state.cpuY + paddle.height &&
        state.ballVX > 0
      ) {
        state.ballX = cpuX - 10;
        bounceFromPaddle(state.cpuY, false);
      }
    }

    function checkScore() {
      if (state.ballX < -20) {
        state.cpuScore += 1;
        updateScore();
        if (state.cpuScore >= WIN_SCORE) {
          state.gameOver = true;
          statusEl.textContent = 'CPU wins the match.';
        } else {
          resetBall(1);
        }
      }

      if (state.ballX > canvas.width + 20) {
        state.playerScore += 1;
        updateScore();
        if (state.playerScore >= WIN_SCORE) {
          state.gameOver = true;
          statusEl.textContent = 'You win the match!';
        } else {
          resetBall(-1);
        }
      }
    }

    function updateBall() {
      state.ballX += state.ballVX;
      state.ballY += state.ballVY;
      handleCollisions();
      checkScore();
    }

    function tick() {
      if (!state.paused && !state.gameOver) {
        updatePlayer();
        updateCpu();
        updateBall();
      }

      drawScene();
      requestAnimationFrame(tick);
    }

    function setKey(event, isPressed) {
      const key = event.key.toLowerCase();

      if (key === 'w' || key === 'arrowup') {
        state.keys.up = isPressed;
        event.preventDefault();
      }

      if (key === 's' || key === 'arrowdown') {
        state.keys.down = isPressed;
        event.preventDefault();
      }

      if (isPressed && key === ' ' && !state.gameOver) {
        state.paused = !state.paused;
        statusEl.textContent = state.paused ? 'Paused.' : 'First to 7 wins.';
        event.preventDefault();
      }
    }

    window.addEventListener('keydown', (event) => setKey(event, true));
    window.addEventListener('keyup', (event) => setKey(event, false));
    resetBtn.addEventListener('click', resetMatch);

    resetMatch();
    tick();
  </script>
</body>
</html>
